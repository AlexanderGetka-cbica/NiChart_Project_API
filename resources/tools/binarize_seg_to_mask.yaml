name: binarize_seg_to_mask
description: Takes a directory of NIfTI segmentations and converts them to binary masks.

inputs:
  seg_dir:
    type: directory
    contents:
      - pattern: "{MRID}_DLMUSE.nii.gz"
        per_subject: true

outputs:
  mask_dir:
    type: directory
    # Observed: input file names are preserved, so masks carry the _DLMUSE stem.
    # dlicv_to_mni consumes these with --mask_suffix _DLMUSE.
    contents:
      - pattern: "{MRID}_DLMUSE.nii.gz"
        per_subject: true

mounts:
  seg_dir:
    path_in_container: /input/segs
    mode: ro
  mask_dir:
    path_in_container: /output/masks
    mode: rw

parameters: {}

resources:
  vcpus: 2
  memory: 14000
  gpus: 0

# Measured 2026-10-27 on cbica/nifti-binarizer:0.0.1, 30 IXI subjects: all masks
# written within 3 s => ~0.1 s/subject. Essentially pure container start.
fixed_seconds: 4
time_per_subject_seconds: 0.1

container:
  image: cbica/nifti-binarizer:0.0.1
  command: --input_dir {seg_dir} --output_dir {mask_dir}
