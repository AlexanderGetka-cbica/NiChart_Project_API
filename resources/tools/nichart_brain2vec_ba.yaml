name: Brain2Vec Brain Age
description: >
  Predicts brain age from a T1-weighted MRI using a Vision Transformer fine-tuned
  on Brain2Vec representations. Turnkey — uses the ViT brain-age weights baked into
  the image (no user-supplied weights). Produces ViT_BA_Predictions.csv with one
  row per subject (MRID + Prediction = predicted brain age in years).

github_url: https://github.com/CBICA/Brain2Vec

inputs:
  t1_img:
    type: directory
    description: Directory of skull-stripped, template-aligned T1 scans produced by the pipeline's preprocessing steps (DLMUSE -> binarize -> align). Brain2Vec is trained on this representation; feeding raw T1s degrades results.

outputs:
  out_dir:
    type: directory
    description: Output directory containing ViT_BA_Predictions.csv (MRID + Prediction).
    merge: directory_union_csv_concat
    # Observed output of cbica/nichart_brain2vec:1.0.2-wrapped.
    contents:
      - pattern: "ViT_BA_Predictions.csv"
        csv_columns: [MRID, Prediction]

mounts:
  t1_img:
    path_in_container: /input/t1
    mode: ro
  out_dir:
    path_in_container: /output
    mode: rw

parameters: {}

resources:
  vcpus: 4
  memory: 6000
  gpus: 1

# Measured 2026-10-27 on cbica/nichart_brain2vec:1.0.3-wrapped (GTX 1080 Ti),
# IXI subjects, two cohort sizes: 14 s at N=5 and 23 s at N=30 => ~12 s fixed plus
# ~0.36 s/subject. Dominated by container start, CUDA init and loading the ViT
# weights. The previous value (15 s/subject, taken from a 3-subject wall time that
# was almost all startup) overestimated a 30-subject run by ~20x.
fixed_seconds: 12
time_per_subject_seconds: 0.36

container:
  image: cbica/nichart_brain2vec:1.0.2-wrapped
  # Apptainer/Singularity: entrypoint run_wrapper.sh dispatches on the first arg ('vit_ba').
  singularity_run_mode: run
  command: "vit_ba {t1_img} {out_dir}"
