name: nichart_dlmuse 
description: This tool extracts DLICV intracranial volumes, DLMUSE segmentations, and ROI volume CSV files.

dependencies: # Names of dependencies. To make another tool's output a dependency, place its name in this list
  - t1_img

inputs:
  t1_img:
    type: directory

outputs:
  dlmuse_vol:
    type: directory
    # Observed output of cbica/nichart_dlmuse: one summary CSV for the cohort.
    contents:
      - pattern: "DLMUSE_Volumes.csv"
        csv_columns: [MRID, DL_MUSE_Volume_702]
  dlmuse_seg:
    type: directory
    # Observed: one segmentation per subject, named after the input T1 stem.
    # Matches results.per_subject in run_dlmuse.yaml.
    contents:
      - pattern: "{MRID}_DLMUSE.nii.gz"
        per_subject: true

mounts:
  t1_img:
    path_in_container: /input/t1
    mode: ro
  dlmuse_vol:
    path_in_container: /output/dlmuse_vol
    mode: rw
  dlmuse_seg:
    path_in_container: /output/dlmuse_seg
    mode: rw

parameters:
  {} # Empty dictionary to signify no parameters

resources: # Used to allocate jobs on the cloud. Please be diligent.
  vcpus: 4
  memory: 28000 # Amount must be in MiB, see https://docs.aws.amazon.com/batch/latest/APIReference/API_ResourceRequirement.html
  gpus: 1

# Measured 2026-10-27 on a GTX 1080 Ti: 140 s at N=1 and 281 s at N=3
# => ~70 s fixed (CUDA init + loading the DLICV and DLMUSE nnU-Net models)
# plus ~70 s/subject. The previous flat 120 s/subject overstated a 30-subject
# run by ~1.7x (60 min vs a measured 36 min).
#
# HARDWARE DEPENDENT: the cloud Batch run of 581 IXI subjects on 2026-10-22
# finished in ~6.2 h, i.e. <=38 s/subject including queue time — roughly twice
# as fast as this local card. These figures are therefore conservative for
# cloud estimates; re-measure on Batch if cloud accuracy matters.
fixed_seconds: 70
time_per_subject_seconds: 70

container:
  image: cbica/nichart_dlmuse:1.0.10-wrapped
  command: -d cuda --in_dir {t1_img} --out_csvs {dlmuse_vol} --out_segs {dlmuse_seg} --cores 1 --refaced-data --dlmuse_args=-nps=1

