name: harmonize_dlmuse
description: Harmonizes DLMUSE ROI volumes to a large reference dataset using ComBat-FAM and subject covariates.

inputs:
  dlmuse_vol_unharmonized:
    type: file
    # Required by the container's wrapper, which fails fast without them.
    csv_columns: [MRID, DL_MUSE_Volume_702]
  covariate_csv:
    type: file
    csv_columns: [MRID, Age, Sex]

outputs:
  dlmuse_vol_harmonized:
    type: directory
    contents:
      - pattern: "DLMUSE_Volumes.csv"
        csv_columns: [MRID]

mounts:
  dlmuse_vol_unharmonized:
    path_in_container: /input/unharmonized_DLMUSE_Volumes.csv
    mode: ro
  covariate_csv:
    path_in_container: /input/covariates.csv
    mode: ro
  dlmuse_vol_harmonized:
    path_in_container: /output/dlmuse_vol_harmonized
    mode: rw

parameters: {}

resources:
  vcpus: 4
  memory: 14000
  gpus: 0

# Measured 2026-10-23 on cbica/combatfam_harmonize_dlmuse:0.0.1 (which now includes
# the harmonization QC assessment), POINTER cohort, two sizes: 60.1 s at N=50 and
# 80.3 s at N=2485 => ~60 s fixed + ~0.008 s/subject. Overwhelmingly container
# start, R warm-up and loading the reference ComBat model.
fixed_seconds: 60
time_per_subject_seconds: 0.008

container:
  image: cbica/combatfam_harmonize_dlmuse:0.0.1
  command: -i {dlmuse_vol_unharmonized} -c {covariate_csv} -o {dlmuse_vol_harmonized}
