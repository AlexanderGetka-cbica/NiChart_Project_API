name: dlicv_to_mni
description: Aligns a directory of NIfTI images to MNI space using associated binary masks (e.g. from DLICV).

inputs:
  img_dir:
    type: directory
  mask_dir:
    type: directory
    # Required by this tool's own --mask_suffix _DLMUSE.
    contents:
      - pattern: "{MRID}_DLMUSE.nii.gz"
        per_subject: true

outputs:
  mni_dir:
    type: directory
    # Observed output of cbica/nifti-align-to-mni:0.0.1.
    contents:
      - pattern: "{MRID}_DLICV_aligned.nii.gz"
        per_subject: true

mounts:
  img_dir:
    path_in_container: /input/images
    mode: ro
  mask_dir:
    path_in_container: /input/masks
    mode: ro
  mni_dir:
    path_in_container: /output/mni
    mode: rw

parameters: {}

resources:
  vcpus: 2
  memory: 14000
  gpus: 0

# Measured 2026-10-27 on cbica/nifti-align-to-mni:0.0.1, 30 IXI subjects:
# 262 s between the first and last output write => ~9 s/subject for the affine
# registration, plus a few seconds of container start. CPU-bound (SimpleITK).
fixed_seconds: 5
time_per_subject_seconds: 9.0

container:
  image: cbica/nifti-align-to-mni:0.0.1
  command: --img_dir {img_dir} --mask_dir {mask_dir} --output_dir {mni_dir} --transform affine --mask_suffix _DLMUSE --template_mask /MNI_template_DLICV.nii.gz
