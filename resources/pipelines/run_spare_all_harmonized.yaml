pipeline_name: SPARE Scores (T1 only, Harmonized)
root_pipeline: spare
harmonized: true
modalities: [T1]
description: |
  Pipeline which uses harmonized DLMUSE features to produce all available SPARE scores using T1 scans.

docs_id: spare
base_variant: run_spare_all

categories:
  - spare
  - inference
  - classification
  - harmonized
  - highlighted
  - brain-age

requires:
  - needs_T1
  - needs_demographics
  - csv_has_columns:
      - name: MRID
        type: string
      - name: Age
        type: float
        min: 0
        max: 120
      - name: Sex
        type: categorical
        values: [M, F]
  - min_subjects:
      required: 3
      recommended: 30

steps:
  - id: run_nichart_dlmuse
    tool: nichart_dlmuse
    inputs:
      t1_img: ${STUDY}/t1
    outputs:
      dlmuse_seg: ${STUDY}/dlmuse_seg
      dlmuse_vol: ${STUDY}/dlmuse_vol

  - id: harmonize_dlmuse
    tool: harmonize_dlmuse
    inputs:
      dlmuse_vol_unharmonized: ${STUDY}/dlmuse_vol/DLMUSE_Volumes.csv
      covariate_csv: ${STUDY}/participants/participants.csv
    outputs:
      dlmuse_vol_harmonized: ${STUDY}/dlmuse_vol_harmonized

  - id: run_spare_all
    tool: spare_all_harmonized
    inputs:
      dlmuse_vol_harmonized: ${STUDY}/dlmuse_vol_harmonized/DLMUSE_Volumes.csv
      demog_csv: ${STUDY}/participants/participants.csv
    outputs:
      spare_all_csv: ${STUDY}/ml_biomarkers_harmonized/SPARE_ALL.csv

results:
  batch_features:
    file: "ml_biomarkers_harmonized/SPARE_ALL.csv"
    mrid_column: "MRID"
    # Feature interpretation for the LLM / UI. Document each output column here —
    # see resources/pipelines/SCHEMA.md (results → features). Completeness is
    # checked by scripts/check_feature_docs.py.
    # TODO: replace {} with entries — definition (required), units, direction,
    #       interpretation, keywords, references + DOIs.
    features: {}
