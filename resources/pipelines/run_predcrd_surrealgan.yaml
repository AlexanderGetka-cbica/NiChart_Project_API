pipeline_name: SurrealGAN
root_pipeline: surrealgan
harmonized: false
modalities: [T1]
description: |
  Prediction of SurrealGAN R-Scores along 5 disease progression dimensions using T1-weighted MRI brain scans via DLMUSE.

docs_id: surrealgan

categories:
  - inference
  - regression
  - surrealgan
  - predcrd

requires:
  - needs_T1
  - needs_demographics
  - csv_has_columns:
      - name: MRID
        type: string
      - name: Age
        type: float
        min: 0
        max: 120
      - name: Sex
        type: categorical
        values: [M, F]

steps:
  - id: run_nichart_dlmuse
    tool: nichart_dlmuse
    inputs:
      t1_img: ${STUDY}/t1
    outputs:
      dlmuse_seg: ${STUDY}/dlmuse_seg
      dlmuse_vol: ${STUDY}/dlmuse_vol

  - id: run_predcrd_surrealgan
    tool: predcrd_surrealgan
    inputs:
      demog_csv: ${STUDY}/participants/participants.csv
      dlmuse_vol: ${STUDY}/dlmuse_vol/DLMUSE_Volumes.csv
    outputs:
      surrealgan_csv: ${STUDY}/ml_biomarkers/SurrealGAN_RScores.csv

results:
  batch_features:
    file: "ml_biomarkers/SurrealGAN_RScores.csv"
    mrid_column: "MRID"
    # Feature interpretation for the LLM / UI. Document each output column here —
    # see resources/pipelines/SCHEMA.md (results → features). Completeness is
    # checked by scripts/check_feature_docs.py.
    # TODO: replace {} with entries — definition (required), units, direction,
    #       interpretation, keywords, references + DOIs.
    features: {}
