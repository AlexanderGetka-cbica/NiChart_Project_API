pipeline_name: SPARE Scores - All-Inclusive (T1 + FLAIR, Harmonized)
description: |
  Pipeline which uses harmonized DLMUSE and DLWMLS features to produce all available CVM SPARE scores from T1 + FLAIR data.

docs_id: spare
base_variant: run_spare_all_cvm

categories:
  - spare
  - inference
  - classification
  - harmonized
  - highlighted
  - cvm

requires:
  - needs_T1
  - needs_FLAIR
  - needs_demographics
  - csv_has_columns:
      - name: MRID
        type: string
      - name: Age
        type: float
        min: 0
        max: 120
      - name: Sex
        type: categorical
        values: [M, F]
  - min_subjects:
      required: 3
      recommended: 30

steps:
  - id: run_nichart_dlmuse
    tool: nichart_dlmuse
    inputs:
      t1_img: ${STUDY}/t1
    outputs:
      dlmuse_seg: ${STUDY}/dlmuse_seg
      dlmuse_vol: ${STUDY}/dlmuse_vol

  - id: harmonize_dlmuse
    tool: harmonize_dlmuse
    inputs:
      dlmuse_vol_unharmonized: ${STUDY}/dlmuse_vol/DLMUSE_Volumes.csv
      covariate_csv: ${STUDY}/participants/participants.csv
    outputs:
      dlmuse_vol_harmonized: ${STUDY}/dlmuse_vol_harmonized

  - id: run_nichart_dlwmls
    tool: nichart_dlwmls_v2
    inputs:
      t1_img: ${STUDY}/t1
      fl_img: ${STUDY}/fl
      dlmuse_seg: ${STUDY}/dlmuse_seg
      demog_csv: ${STUDY}/participants/participants.csv
    outputs:
      nichart_dlwmls_out: ${STUDY}/nichart_dlwmls_out

  - id: merge_feature_csvs
    tool: merge_feature_csvs_by_mrid
    inputs:
      csv_1: ${STUDY}/dlmuse_vol_harmonized/DLMUSE_Volumes.csv
      csv_2: ${STUDY}/nichart_dlwmls_out/DLWMLS_DLMUSE_Segmented_Volumes.csv
    outputs:
      out_csv: ${STUDY}/merged_dlmuse_dlwmls/csv_out.csv

  - id: run_spare_all_cvm_harmonized
    tool: spare_all_cvm_harmonized
    inputs:
      merged_dlwmls_dlmuse_csv: ${STUDY}/merged_dlmuse_dlwmls/csv_out.csv
      demog_csv: ${STUDY}/participants/participants.csv
    outputs:
      spare_all_cvm_csv: ${STUDY}/ml_biomarkers_harmonized/SPARE_ALL_CVM.csv

results:
  batch_features:
    file: "ml_biomarkers_harmonized/SPARE_ALL_CVM.csv"
    mrid_column: "MRID"
    # Feature interpretation for the LLM / UI. Document each output column here —
    # see resources/pipelines/SCHEMA.md (results → features). Completeness is
    # checked by scripts/check_feature_docs.py.
    # TODO: replace {} with entries — definition (required), units, direction,
    #       interpretation, keywords, references + DOIs.
    features: {}
